[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "h2opt"
version = "0.2.0"
description = "H2-opt: self-supervised discovery of heritable traits in high-throughput phenotyping data"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy", "torch"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["h2opt"]
